name: oralab

services:
  oracle:
    # Advanced users may change this reference. OraLab never rewrites this file.
    image: container-registry.oracle.com/database/enterprise:19.3.0.0
    environment:
      ORACLE_SID: ${ORACLE_SID:-ORCLCDB}
      ORACLE_PDB: ${ORACLE_PDB:-ORCLPDB1}
      ORACLE_PWD: ${ORACLE_PWD:?Run oralab init before starting the lab.}
    ports:
      - "127.0.0.1:1521:1521"
      - "127.0.0.1:5500:5500"
    volumes:
      - oralab-oradata:/opt/oracle/oradata
    shm_size: ${ORACLE_SHM_SIZE:-1g}
    cpus: ${ORACLE_CPUS:-4}
    mem_limit: ${ORACLE_MEMORY:-6g}
    stop_grace_period: ${ORALAB_STOP_GRACE_PERIOD:-10m}

volumes:
  oralab-oradata:
    external: true
    name: oralab-oradata
